<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Unymarket - Recuperar contraseña</title>
        <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/login.css">
        <link rel="stylesheet" href="../css/recuperar.css">
    </head>

    <body>
        <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <defs>
                <filter id="rugoso" x="-4%" y="-4%" width="108%" height="108%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="n"/>
                    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
                </filter>
            </defs>
        </svg>

        <div id="tarjeta">
            <div id="avatar">
                <svg viewBox="0 0 100 100" aria-hidden="true">
                    <circle cx="50" cy="28" r="17" fill="#f7e31b" stroke="#d9c200" stroke-width="3"/>
                    <path d="M18 86 Q22 52 50 50 Q78 52 82 86Z" fill="#f7e31b" stroke="#d9c200" stroke-width="3"/>
                </svg>
                <span class="insignia" aria-hidden="true">?</span>
            </div>

            <h2>Recuperar contraseña</h2>

            <form id="formulario_recuperar" action="Tu_direccion" method="post">
                <p class="explicacion">Escribe el correo con el que te registrarte.</p>

                <div class="campo">
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <button type="submit" class="boton_enviar">Enviar</button>
                <p class="aviso_demo" id="aviso_demo"></p>
                <p class="cambio"><a href="login.html">← Volver a iniciar sesión</a></p>
            </form>
        </div>
        <script src="../js/demo.js"></script>
    </body>
</html>
