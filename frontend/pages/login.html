<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Unymarket - Iniciar sesión</title>
        <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/login.css">
    </head>
    <body>
        <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <defs>
                <filter id="rugoso" x="-4%" y="-4%" width="108%" height="108%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="n"/>
                    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="G"/>
                </filter>
            </defs>
        </svg>

        <div id="tarjeta">
            <div id="avatar">
                <svg viewBox="0 0 100 100" aria-hidden="true">
                    <circle cx="50" cy="28" r="17" fill="#f7e31b" stroke="#d9c200" atroke-width="3"/>
                    <path d="M18 86 Q22 52 50 50 Q78 52 82 86Z" fill="#f7e31b" stroke="#d9c200" stroke-width="3"/>
                </svg>
            </div>

            <h2>Iniciar sesión</h2>

            <form id="formulario_login">
                <p id="mensaje_error"></p>
                <div class="campo">
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="fila_opciones">
                    <label class="mostrar">
                        <input type="checkbox" id="mostrar_password"> Mostrar contraseña
                    </label>
                    <a href="../pages/recuperar.html" class="olvido">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="boton_enviar">Entrar</button>

                <p class="cambio">¿No tienes cuenta? <a href="../pages/registro.html">Regístrate</a></p>

            </form>
        </div>

        <script src="../js/login.js"></script>
        <script src="../js/apiLogin.js"></script>
        <script src="../js/demo.js"></script>
    </body>
</html>
