<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unymarket - Crear cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/registro.css">
</head>

<body>
    <svg width="0" height="0" style="position:absolute" area-hidden="true">
        <defs>
            <filter id="rugoso" x="-4%" y="-4%" width="108%" height="108%">
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="n" />
                <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div id="tarjeta">
        <div id="avatar">
            <svg viewBox="0 0 100 100" area-hidden="true">
                <circle cx="50" cy="28" r="17" fill="#f7e31b" stroke="#d9c200" stroke-width="3" />
                <path d="M18 86 Q22 52 50 50 Q78 52 82 86Z" fill="#f7e31b" stroke="#d9c200" stroke-width="3" />
            </svg>

            <span class="mas" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="3.5" stroke-linecap="round" />
                </svg>
            </span>
        </div>

        <h2>Crear cuenta</h2>

        <form id="formulario_registro">
            <p id="mensaje_error"></p>
            <p id="mensaje_exito"></p>
            <div class="campo">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>

            <div class="campo">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>

            <label class="mostrar">
                <input type="checkbox" id="mostrar_password"> Mostrar contraseña
            </label>

            <button type="submit" class="boton_enviar">Registrarme</button>

            <p class="cambio">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
        </form>
    </div>

    <script src="../js/login.js"></script>
    <script src="../js/demo.js"></script>
    <script src="../js/apiRegistro.js"></script>
</body>

</html>
